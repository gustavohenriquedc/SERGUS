<html lang="pt-BR">
<head>

    <style>
        /* Tudo configurado em um único lugar para não bugar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f5;
            color: #18181b;
        }

        header {
            background-color: #09090b;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            letter-spacing: 2px;
            font-size: 28px;
            text-transform: uppercase;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        .banner {
            background-color: #18181b;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }

        .banner h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .banner p {
            color: #a1a1aa;
            font-size: 18px;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .titulo-secao {
            font-size: 24px;
            margin-bottom: 20px;
            border-left: 5px solid #09090b;
            padding-left: 10px;
        }

        /* Design do Quiz */
        .quiz-container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }

        .quiz-pergunta {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .quiz-opcoes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .quiz-opcoes button {
            background-color: #f4f4f5;
            color: #18181b;
            border: 2px solid #e4e4e7;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .quiz-opcoes button:hover {
            background-color: #09090b;
            color: white;
        }

        .resultado-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0fdf4;
            border-left: 5px solid #22c55e;
            border-radius: 4px;
        }

        /* Design da Vitrine */
        .vitrine {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

            background-color: white;
            border-radius: 8px;

            text-align: center;
        }
