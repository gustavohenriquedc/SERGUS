<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sergus | Sapatos Masculinos e Tênis Streetwear</title>
    <style>
        /* Configurações Gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            scroll-behavior: smooth; /* Faz a página rolar suavemente via JavaScript */
        }

        body {
            background-color: #f4f4f5;
            color: #18181b;
        }

        /* ========================================================
           🔥 NOVA CAPA EM TELA CHEIA (HERO LANDING)
           ======================================================== */
        .capa-container {
            background-color: #09090b;
            color: white;
            height: 100vh; /* Ocupa exatamente 100% da altura da tela */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .capa-container h2 {
            font-size: 64px;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .capa-container p {
            color: #a1a1aa;
            font-size: 18px;
            max-width: 600px;
            margin-bottom: 35px;
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .btn-explorar {
            background-color: white;
            color: #09090b;
            border: none;
            padding: 16px 45px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }

        .btn-explorar:hover {
            background-color: #e4e4e7;
            transform: scale(1.05); /* Efeito de zoom leve ao passar o mouse */
        }

        /* Menu / Cabeçalho */
        header {
            background-color: #09090b;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-top: 1px solid #27272a;
        }

        header h1 {
            letter-spacing: 2px;
            font-size: 24px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #a1a1aa;
        }

        /* Container da Vitrine */
        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 20px;
        }

        /* Grade de Produtos - 2 colunas fixas */
        .vitrine {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        /* Cartão do Produto */
        .produto-card {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .produto-card:hover {
            transform: translateY(-3px);
        }

        .ultimo-produto {
            grid-column: 2;
        }

        .produto-foto {
            width: 100%;
            height: 240px;
            background-color: #e4e4e7;
            border-radius: 6px;
            margin-bottom: 15px;
            object-fit: cover;
        }

        .produto-nome {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .produto-preco {
            font-size: 20px;
            font-weight: bold;
            color: #09090b;
            margin-bottom: 15px;
        }

        /* Estilos dos Botões */
        .botoes-grupo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-comprar {
            background-color: #09090b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
        }

        .btn-comprar:hover {
            background-color: #27272a;
        }

        .btn-detalhes {
            background-color: #e4e4e7;
            color: #09090b;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
        }

        .btn-detalhes:hover {
            background-color: #d4d4d8;
        }

        /* Rodapé */
        footer {
            background-color: #09090b;
            color: #71717a;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
        }

        /* Responsividade Básica */
        @media (max-width: 600px) {
            .capa-container h2 { font-size: 44px; }
            .capa-container p { font-size: 16px; }
            .vitrine { grid-template-columns: 1fr; }
            .ultimo-produto { grid-column: auto; }
        }
    </style>
</head>
