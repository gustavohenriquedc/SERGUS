<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sergus | Sapatos Masculinos e Tênis Streetwear</title>
    <style>
        /* Configurações Gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f5;
            color: #18181b;
        }

        /* Menu de Navegação */
        header {
            background-color: #09090b;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            letter-spacing: 2px;
            font-size: 24px;
            text-transform: uppercase;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            cursor: pointer;
        }

        nav a:hover {
            color: #a1a1aa;
        }

        /* Banner */
        .banner {
            background-color: #18181b;
            color: white;
            text-align: center;
            padding: 60px 20px;
        }

        .banner h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        /* Container Principal */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .titulo-secao {
            font-size: 24px;
            margin-bottom: 20px;
            border-left: 5px solid #09090b;
            padding-left: 10px;
            text-transform: uppercase;
        }

        /* PÁGINA 1: VITRINE PRINCIPAL */
        .vitrine {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .produto-card {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .produto-foto {
            width: 100%;
            height: 180px;
            background-color: #e4e4e7;
            border-radius: 6px;
            margin-bottom: 12px;
            object-fit: cover;
        }

        div.produto-foto {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #71717a;
            font-weight: bold;
            font-size: 14px;
        }

        .produto-nome {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .produto-preco {
            font-size: 18px;
            font-weight: bold;
            color: #09090b;
            margin-bottom: 12px;
        }

        /* Botões Gerais */
        .botoes-grupo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-comprar {
            background-color: #09090b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-detalhes {
            background-color: #e4e4e7;
            color: #09090b;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* PÁGINA 2: DETALHES INTERNOS */
        .pagina-detalhes {
            background-color: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: none;
        }

        .detalhes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            margin-top: 20px;
        }

        .detalhes-foto-bloco {
            width: 100%;
            height: 350px;
            background-color: #e4e4e7;
            border-radius: 8px;
            object-fit: cover;
        }

        .detalhes-info h4 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #09090b;
        }

        .detalhes-info .preco-grande {
            font-size: 24px;
            font-weight: bold;
            color: #18181b;
            margin-bottom: 20px;
        }

        .detalhes-info p {
            font-size: 16px;
            line-height: 1.6;
            color: #52525b;
            margin-bottom: 20px;
        }

        .tabela-tamanhos {
            margin-bottom: 25px;
        }

        .tabela-tamanhos span {
            display: inline-block;
            border: 1px solid #d4d4d8;
            padding: 8px 12px;
            margin: 4px;
            border-radius: 4px;
            font-weight: 500;
        }

        .btn-voltar {
            background-color: #71717a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* PÁGINA 3: CENTRAL DE CONTATO */
        .pagina-contato {
            display: none;
            background-color: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .contato-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            margin-top: 20px;
        }

        .contato-info p {
            margin-bottom: 15px;
            font-size: 16px;
            color: #52525b;
        }

        .canais-rapidos {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-canal {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            font-size: 14px;
        }

        .btn-whatsapp { background-color: #25d366; }
        .btn-email-direto { background-color: #2563eb; }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-grupo label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-grupo input, .form-grupo textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #e4e4e7;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        /* Rodapé */
        footer {
            background-color: #09090b;
            color: #71717a;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
