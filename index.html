<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sergus | Sapatos Masculinos e Tênis Streetwear</title>
    <style>
        /* Configurações Gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f5;
            color: #18181b;
        }

        /* Menu / Cabeçalho */
        header {
            background-color: #09090b;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            letter-spacing: 2px;
            font-size: 24px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #a1a1aa;
        }

        /* Container da Vitrine */
        .container {
            max-width: 900px; /* Reduzido para os cartões ficarem com um tamanho melhor em 2 colunas */
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Grade de Produtos - Configurada para 2 colunas fixas */
        .vitrine {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Força a exibição em exatamente 2 colunas */
            gap: 25px;
        }

        /* Cartão do Produto */
        .produto-card {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .produto-card:hover {
            transform: translateY(-3px);
        }

        /* Alinhamento Especial: força o sexto calçado a ir para debaixo da segunda coluna */
        .ultimo-produto {
            grid-column: 2;
        }

        .produto-foto {
            width: 100%;
            height: 240px; /* Aumentado o tamanho da foto para valorizar as imagens locais */
            background-color: #e4e4e7;
            border-radius: 6px;
            margin-bottom: 15px;
            object-fit: cover;
        }

        .produto-nome {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .produto-preco {
            font-size: 20px;
            font-weight: bold;
            color: #09090b;
            margin-bottom: 15px;
        }

        /* Estilos dos Botões */
        .botoes-grupo {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-comprar {
            background-color: #09090b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
        }

        .btn-comprar:hover {
            background-color: #27272a;
        }

        .btn-detalhes {
            background-color: #e4e4e7;
            color: #09090b;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
        }

        .btn-detalhes:hover {
            background-color: #d4d4d8;
        }

        /* Rodapé */
        footer {
            background-color: #09090b;
            color: #71717a;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
        }

        /* Responsividade para Celulares Pequenos (opcional para não quebrar em telas minúsculas) */
        @media (max-width: 500px) {
            .vitrine {
                grid-template-columns: 1fr; /* Vira 1 coluna no celular para melhor leitura */
            }
            .ultimo-produto {
                grid-column: auto; /* Desfaz o alinhamento no celular */
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>SERGUS</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Produtos</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <main class="container">
        
        <div class="vitrine">
            
            <!-- Linha 1 - Coluna 1 -->
            <div class="produto-card">
                <img src="lucid-origin_Urban_Streetwear_Sneakers_Men_s_casual_sneakers_with_a_high_sole_super_comfortab-0.jpg" alt="Tênis Streetwear Urban" class="produto-foto">
                <div class="produto-nome">Tênis Streetwear Urban</div>
                <div class="produto-preco">R$ 249,90</div>
                <div class="botoes-grupo">
                    <button class="btn-detalhes" onclick="verDetalhes('Tênis Streetwear Urban', 'R$ 249,90', 'Solado alto texturizado com borracha vulcanizada, palmilha anatômica em EVA expandido e cabedal em lona respirável premium.')">Ver Detalhes</button>
                    <button class="btn-comprar" onclick="comprarItem('Tênis Streetwear Urban')">Comprar</button>
                </div>
            </div>

            <!-- Linha 1 - Coluna 2 -->
            <div class="produto-card">
                <img src="bota.coturno.webp" alt="Bota Coturno Casual" class="produto-foto">
                <div class="produto-nome">Bota Coturno Casual</div>
                <div class="produto-preco">R$ 289,90</div>
                <div class="botoes-grupo">
                    <button class="btn-detalhes" onclick="verDetalhes('Bota Coturno Casual', 'R$ 289,90', 'Corte em couro sintético ecológico de alta qualidade, costuras duplas reforçadas e revestimento interno acolchoado.')">Ver Detalhes</button>
                    <button class="btn-comprar" onclick="comprarItem('Bota Coturno Casual')">Comprar</button>
                </div>
            </div>

            <!-- Linha 2 - Coluna 1 -->
            <div class="produto-card">
                <img src="mocassin.slim.webp" alt="Mocassim Jovem Slim" class="produto-foto">
                <div class="produto-nome">Mocassim Jovem Slim</div>
                <div class="produto-preco">R$ 199,90</div>
                <div class="botoes-grupo">
                    <button class="btn-detalhes" onclick="verDetalhes('Mocassim Jovem Slim', 'R$ 199,90', 'Modelo prático sem cadarço estilo slip-on. Traz solado minimalista antiderrapante e costuras artesanais frontais.')">Ver Detalhes</button>
                    <button class="btn-comprar" onclick="comprarItem('Mocassim Jovem Slim')">Comprar</button>
                </div>
            </div>

            <!-- Linha 2 - Coluna 2 -->
            <div class="produto-card">
                <img src="tenis.ca.jfif" alt="Tênis Cano Alto Retro" class="produto-foto">
                <div class="produto-nome">Tênis Cano Alto Retro</div>
                <div class="produto-preco">R$ 279,90</div>
                <div class="botoes-grupo">
                    <button class="btn-detalhes" onclick="verDetalhes('Tênis Cano Alto Retro', 'R$ 279,90', 'Visual retrô inspirado nas quadras de basquete dos anos 90. Confeccionado em camurça macia com cano alto protetor.')">Ver Detalhes</button>
                    <button class="btn-comprar" onclick="comprarItem('Tênis Cano Alto Retro')">Comprar</button>
                </div>
            </div>

            <!-- Linha 3 - Coluna 1 -->
            <div class="produto-card">
                <img src="sneaker.jfif" alt="Sneaker Sport Casual" class="produto-foto">
                <div class="produto-nome">Sneaker Sport Casual</div>
                <div class="produto-preco">R$ 229,90</div>
                <div class="botoes-grupo">
                    <button class="btn-detalhes" onclick="verDetalhes('Sneaker Sport Casual', 'R$ 229,90', 'Desenvolvido com tecnologia de amortecimento responsivo leve e tecido em malha mesh respirável.')">Ver Detalhes</button>
                    <button class="btn-comprar" onclick="comprarItem('Sneaker Sport Casual')">Comprar</button>
                </div>
            </div>

            <!-- Linha 3 - Coluna 2 (O sexto calçado posicionado com classe exclusiva) -->
            <div class="produto-card ultimo-produto">
                <img src="tenis.slip.webp" alt="Tênis Slip-on Urban" class="produto-foto">
                <div class="produto-nome">Tênis Slip-on Urban</div>
                <div class="produto-preco">R$ 179,90</div>
                <div class="botoes-grupo">
                    <button class="btn-detalhes" onclick="verDetalhes('Tênis Slip-on Urban', 'R$ 179,90', 'O modelo mais leve e maleável da coleção. Conta com eficientes elásticos de ajuste nas laterais para calce rápido.')">Ver Detalhes</button>
                    <button class="btn-comprar" onclick="comprarItem('Tênis Slip-on Urban')">Comprar</button>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Sergus Calçados. Atividade Escolar - Todos os direitos reservados.</p>
    </footer>

    <script>
        function verDetalhes(nome, preco, info) {
            alert(`👟 ${nome}\n💰 Preço: ${preco}\n\n📋 Informações:\n${info}`);
        }

        function comprarItem(nome) {
            alert(`O produto "${nome}" foi adicionado com sucesso!`);
        }
    </script>

</body>
</html>
