<script>
    // 1. Estado do Carrinho (guarda os produtos selecionados)
    let carrinho = [];

    // 2. Função para Filtrar Produtos por Categoria
    function filtrarProdutos(categoria, botao) {
        // Remove a classe 'ativo' de todos os botões de filtro
        const botoesFiltro = document.querySelectorAll('.btn-filtro');
        botoesFiltro.forEach(btn => btn.classList.remove('ativo'));
        
        // Adiciona a classe 'ativo' apenas no botão que foi clicado
        botao.classList.add('ativo');

        // Seleciona todos os cards de produtos da vitrine
        const produtos = document.querySelectorAll('.produto-card');

        // Percorre cada produto e decide se deve aparecer ou sumir
        produtos.forEach(produto => {
            const categoriaProduto = produto.getAttribute('data-categoria');
            
            if (categoria === 'todos' || categoriaProduto === categoria) {
                produto.style.display = 'flex';
            } else {
                produto.style.display = 'none';
            }
        });
    }

    // 3. Função para Abrir e Fechar a Gaveta do Carrinho
    function toggleCarrinho() {
        const modal = document.querySelector('.carrinho-modal');
        const overlay = document.querySelector('.carrinho-overlay');
        
        modal.classList.toggle('ativo');
        overlay.classList.toggle('ativo');
    }

    // 4. Função para Adicionar Produtos ao Carrinho
    function adicionarAoCarrinho(nome, preco) {
        // Verifica se o produto já existe no carrinho
        const index = carrinho.findIndex(item => item.nome === nome);

        if (index > -1) {
            // Se já existe, aumenta apenas a quantidade
            carrinho[index].quantidade += 1;
        } else {
            // Se não existe, adiciona um novo objeto ao array
            carrinho.push({
                nome: nome,
                preco: preco,
                quantidade: 1
            });
        }

        // Atualiza visualmente o carrinho na tela e abre a gaveta
        atualizarCarrinho();
        toggleCarrinho();
    }

    // 5. Função para Remover um Item do Carrinho
    function removerDoCarrinho(index) {
        carrinho.splice(index, 1);
        atualizarCarrinho();
    }

    // 6. Função para Atualizar a Interface do Carrinho
    function atualizarCarrinho() {
        const corpoCarrinho = document.querySelector('.carrinho-body');
        const contadorCarrinho = document.getElementById('cart-count');
        const spansTotal = document.querySelectorAll('.total-box span');
        const spanValorTotal = spansTotal[1]; // Pega o segundo span da caixa de total

        // Limpa a lista atual para reescrever com os dados atualizados
        corpoCarrinho.innerHTML = '';

        let totalItens = 0;
        let precoTotal = 0;

        if (carrinho.length === 0) {
            corpoCarrinho.innerHTML = '<p style="text-align: center; color: #71717a; margin-top: 20px;">O seu carrinho está vazio.</p>';
        } else {
            carrinho.forEach((item, index) => {
                totalItens += item.quantidade;
                precoTotal += item.preco * item.quantidade;

                const divItem = document.createElement('div');
                divItem.classList.add('item-carrinho');
                divItem.innerHTML = `
                    <div class="item-carrinho-info">
                        <strong>${item.nome}</strong>
                        <span>Qtd: ${item.quantidade}</span>
                        <div class="item-carrinho-preco">R$ ${(item.preco * item.quantidade).toFixed(2).replace('.', ',')}</div>
                    </div>
                    <button class="btn-remover-item" onclick="removerDoCarrinho(${index})">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                corpoCarrinho.appendChild(divItem);
            });
        }

        // Atualiza o número indicador no ícone da sacola no topo
        contadorCarrinho.textContent = totalItens;

        // Atualiza o valor total formatado em
